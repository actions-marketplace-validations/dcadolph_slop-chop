name: slop-chop
description: Flag or fix AI writing tells in markdown and prose, like em-dashes and filler phrases. Fails the check on slop.
branding:
  icon: scissors
  color: green

inputs:
  files:
    description: Space separated list of files to check or fix. Leave empty to check
      only the pull request text.
    required: false
    default: ""
  profile:
    description: Path to a JSON style profile. Leave empty for the built in profile.
    required: false
    default: ""
  dialect:
    description: Enforce a spelling variant, american or british. Leave empty to leave
      spelling alone.
    required: false
    default: ""
  preset:
    description: Apply built-in presets on top of the profile, comma separated (e.g.
      plain). Leave empty for none.
    required: false
    default: ""
  mode:
    description: check lists every finding and fails the run when a file's slop score is
      above max. fix rewrites the files in place.
    required: false
    default: check
  max:
    description: Fail the run when any file's slop score is above this 0-100 value. The
      default of 25 is the line where human READMEs almost never land. Use 100 to turn
      the score gate off.
    required: false
    default: "25"
  strict:
    description: In check mode, also fail on any single finding, including whitespace and
      punctuation tidy-ups. By default only the score gate fails the run.
    required: false
    default: "false"
  sarif:
    description: In check mode, also write every finding to this path as one SARIF 2.1.0
      log, for github/codeql-action/upload-sarif to show as code scanning alerts. Leave
      empty to skip.
    required: false
    default: ""
  pull-request:
    description: In check mode, also check the pull request title and body, under the
      same max and strict gates as the files. A run with no pull request in its event
      skips it.
    required: false
    default: "false"
  pull-request-title:
    description: The title checked when pull-request is true. Defaults to the title of
      the pull request that triggered the run.
    required: false
    default: ${{ github.event.pull_request.title }}
  pull-request-body:
    description: The body checked when pull-request is true. Defaults to the body of the
      pull request that triggered the run.
    required: false
    default: ${{ github.event.pull_request.body }}
  scoring-version:
    description: Fail the run when the engine's scoring version is not this number. Set it
      to the version your score gate was tuned against, so a tag bump that changes scoring
      stops the job instead of moving the gate. Leave empty to skip the check. See
      docs/SCORING.md.
    required: false
    default: ""
  commit:
    description: In fix mode, commit and push the rewritten files. The workflow needs
      contents write permission for the push to land.
    required: false
    default: "false"
  message:
    description: Commit message used when commit is true.
    required: false
    default: Chop the slop

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false

    - name: Build slop-chop
      shell: bash
      working-directory: ${{ github.action_path }}
      run: go build -o "${RUNNER_TEMP}/slop-chop" .

    - name: Run slop-chop
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        PROFILE: ${{ inputs.profile }}
        DIALECT: ${{ inputs.dialect }}
        PRESET: ${{ inputs.preset }}
        MODE: ${{ inputs.mode }}
        MAX: ${{ inputs.max }}
        STRICT: ${{ inputs.strict }}
        SARIF: ${{ inputs.sarif }}
        PULL_REQUEST: ${{ inputs.pull-request }}
        PR_TITLE: ${{ inputs.pull-request-title }}
        PR_BODY: ${{ inputs.pull-request-body }}
        SCORING_VERSION: ${{ inputs.scoring-version }}
      run: |
        read -ra files <<< "$FILES"
        have="$(printf '' | "${RUNNER_TEMP}/slop-chop" score --json |
          sed -n 's/.*"scoringVersion":\([0-9][0-9]*\).*/\1/p')"
        echo "slop-chop scoring version ${have}"
        if [ -n "$SCORING_VERSION" ] && [ "$SCORING_VERSION" != "$have" ]; then
          echo "slop-chop: the engine scores at version ${have} but scoring-version pins ${SCORING_VERSION}." >&2
          echo "Read docs/SCORING.md, retune the gate, then update the pin." >&2
          exit 1
        fi
        args=()
        if [ -n "$PROFILE" ]; then args+=(--profile "$PROFILE"); fi
        if [ -n "$DIALECT" ]; then args+=(--dialect "$DIALECT"); fi
        if [ -n "$PRESET" ]; then args+=(--preset "$PRESET"); fi
        case "$MODE" in
          check)
            rc=0
            for f in "${files[@]}"; do
              echo "::group::slop-chop check $f"
              if [ "$STRICT" = "true" ]; then
                "${RUNNER_TEMP}/slop-chop" check "${args[@]}" "$f" || rc=1
              else
                "${RUNNER_TEMP}/slop-chop" check "${args[@]}" "$f" || true
              fi
              echo "::endgroup::"
            done
            if [ -n "$MAX" ]; then
              for f in "${files[@]}"; do
                "${RUNNER_TEMP}/slop-chop" score --max "$MAX" "${args[@]}" "$f" || rc=1
              done
            fi
            if [ "$PULL_REQUEST" = "true" ]; then
              if [ -z "$PR_TITLE" ] && [ -z "$PR_BODY" ]; then
                echo "slop-chop: no pull request title or body to check"
              else
                # The title is line 1 and the body starts on line 3. The text comes in
                # through env and is only ever piped, never expanded into a command.
                text="$(printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY")"
                echo "::group::slop-chop check pull request title and body"
                if [ "$STRICT" = "true" ]; then
                  printf '%s\n' "$text" | "${RUNNER_TEMP}/slop-chop" check "${args[@]}" || rc=1
                else
                  printf '%s\n' "$text" | "${RUNNER_TEMP}/slop-chop" check "${args[@]}" || true
                fi
                if [ -n "$MAX" ]; then
                  printf '%s\n' "$text" | "${RUNNER_TEMP}/slop-chop" score --max "$MAX" "${args[@]}" || rc=1
                fi
                echo "::endgroup::"
              fi
            fi
            if [ -n "$SARIF" ]; then
              sarif_rc=0
              "${RUNNER_TEMP}/slop-chop" check --sarif "${args[@]}" "${files[@]}" > "$SARIF" || sarif_rc=$?
              # Exit 1 is findings, but a redirect that cannot open the path also exits 1,
              # and every real run writes a log, even an empty one.
              if [ "$sarif_rc" -gt 1 ] || [ ! -s "$SARIF" ]; then
                echo "slop-chop: could not write the SARIF log to ${SARIF}" >&2
                exit "$sarif_rc"
              fi
              echo "slop-chop wrote ${SARIF}"
            fi
            if [ "$rc" -ne 0 ]; then
              echo "slop-chop found slop. See the groups above." >&2
            fi
            exit "$rc"
            ;;
          fix)
            if [ "$PULL_REQUEST" = "true" ]; then
              echo "slop-chop: pull-request works in check mode only" >&2
              exit 2
            fi
            for f in "${files[@]}"; do
              echo "::group::slop-chop fix $f"
              "${RUNNER_TEMP}/slop-chop" fix "${args[@]}" -w "$f"
              echo "::endgroup::"
            done
            ;;
          *)
            echo "slop-chop: unknown mode '$MODE' (want check or fix)" >&2
            exit 2
            ;;
        esac

    - name: Commit the fixes
      if: ${{ inputs.mode == 'fix' && inputs.commit == 'true' }}
      shell: bash
      env:
        FILES: ${{ inputs.files }}
        MESSAGE: ${{ inputs.message }}
      run: |
        read -ra files <<< "$FILES"
        if git diff --quiet -- "${files[@]}"; then
          echo "slop-chop: nothing to commit"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -- "${files[@]}"
        git commit -m "$MESSAGE"
        git push
