name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The authorship guard below reads commit messages, which needs real history
          # rather than the single squashed commit a shallow clone gives.
          fetch-depth: 0
      # Nothing in this repository is co-authored. A trailer naming a tool puts that tool
      # in the contributors list on GitHub, which is a claim about who wrote the software,
      # so the build refuses one rather than leaving it to be noticed later.
      - name: No commit may claim a co-author
        run: |
          set -euo pipefail
          if git log --format='%H %B' | grep -inE '^[[:space:]]*co-authored-by:'; then
            echo "::error::A commit carries a Co-Authored-By trailer. Strip it before pushing."
            exit 1
          fi
          echo "no co-author trailers in history"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build -o slop-chop .
      - run: go build ./...
      - run: GOOS=js GOARCH=wasm go build -o /dev/null ./wasm
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -cover -coverprofile=coverage.out ./... | tee coverage.txt
      - name: Coverage must stay at or above 80 percent in every tested package
        # The root package is main only and the wasm package needs a js target, so the
        # gate applies to every package the test run actually measured.
        run: |
          awk '
            $1 == "ok" {
              v = ""
              for (i = 1; i <= NF; i++) if ($i == "coverage:") { v = $(i+1); gsub("%", "", v) }
              if (v != "" && v + 0 < 80) { printf "below 80%%: %s at %s%%\n", $2, v; fail = 1 }
            }
            END { exit fail }' coverage.txt
      - run: go tool cover -html=coverage.out -o coverage.html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
      - name: The tells page must match the profile it documents
        run: go run . tells --markdown | diff - docs/TELLS.md
      - name: The evaluation corpus must stay locked away from the development corpus
        run: go run ./evaldata/harness -check
      # The extension is plain JavaScript with no build step, and its edit logic is the one
      # part that can corrupt a user's file, so its helper tests run here under plain node.
      - name: The VS Code extension's edit helpers must pass their tests
        run: node --test vscode/fixes.test.js
      # The release builds these two targets and nothing else did, so a Makefile break
      # reached a tag before anyone noticed and cost four stores their publish. Building
      # them here puts that failure in a pull request instead of in a release.
      - name: The plugin and package bundles the release ships must build
        run: |
          set -euo pipefail
          make obsidian
          make npm-package
          make vscode
          # An empty variable in a recipe still runs, so the bundle can build from the
          # wrong bytes. Check the payload landed rather than trusting the exit code.
          test -s obsidian/dist/main.js
          grep -q "SLOP_WASM_B64_GZ" obsidian/dist/main.js
          test -s npm/engine/slop-chop.wasm
          test -s vscode/engine/slop-chop.wasm
          # The MCP bundles are the artifact the registry points at, and nothing outside
          # the release built them either. A bundle that fails to build reaches a tag and
          # the registry entry names a file that was never attached.
          make mcpb
          test "$(ls dist/*.mcpb | wc -l)" -eq 6
          unzip -p dist/slop-chop-mcp_*_linux_amd64.mcpb manifest.json | grep -q '"type": "binary"'
      # The extension runs the wasm engine in place of the binary, so on the same input the
      # two must report the same findings at the same offsets and chop to the same text.
      - name: The VS Code extension's bundled engine must match the binary
        run: node --test vscode/engine.test.js
      # The npm package hands a voice to the engine, so it must chop and score with a voice
      # the way the binary does with the same voice file.
      - name: The npm package must fold a voice the way the binary does
        run: node --test npm/index.test.js
      - name: Every shipped surface must carry the same version
        run: make check-versions
      # Share the compiled binary so the check jobs need no Go toolchain, which keeps them off
      # setup-go, the heavier action whose download was the source of the flaky setup failures.
      - uses: actions/upload-artifact@v7
        with:
          name: slop-chop-binary
          path: slop-chop
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the go directive rather than "stable". The linter parses the standard
      # library of whatever Go it runs on, so a runner that moves to a release the pinned
      # golangci-lint does not know yet crashes on stdlib source that is not ours.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Build golangci-lint from source with that Go so its build version is not older than
      # the go directive, which the prebuilt binaries can lag behind.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run ./...

  action-passes-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write a clean file
        run: printf 'a plain sentence that reads just fine\n' > clean.md
      - name: Action should pass on clean text
        uses: ./
        with:
          files: clean.md

  action-fixes-slop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write a slopful file
        run: printf 'In summary, a plan—and it works; it ships.\n' > dirty.md
      - name: Action should rewrite the file in place
        uses: ./
        with:
          files: dirty.md
          mode: fix
      - name: File must be clean afterward
        run: |
          cat dirty.md
          if grep -qE '—|In summary' dirty.md; then
            echo "fix left slop behind" >&2
            exit 1
          fi

  # The default gate is the slop score, not the single finding. Whitespace and punctuation
  # tidy-ups are listed but do not fail a run, because two in three ordinary human READMEs
  # carry at least one and almost none score high. Strict mode keeps the any-finding
  # behavior for people who want it.
  action-gates-on-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write a file with a whitespace tidy-up and no tells
        run: printf 'A plain sentence  with a double space.\n' > tidy.md
      - name: The default gate lists the tidy-up and lets it through
        uses: ./
        with:
          files: tidy.md
      - name: Strict mode fails the same file
        id: strict
        continue-on-error: true
        uses: ./
        with:
          files: tidy.md
          strict: "true"
      - name: Strict mode must have failed
        run: test "${{ steps.strict.outcome }}" = "failure"
      - name: Write a file dense with tells
        run: printf 'In summary, a comprehensive result. Furthermore, it is important to note that we delve into a robust, seamless framework.\n' > dense.md
      - name: The default gate fails the dense file
        id: dense
        continue-on-error: true
        uses: ./
        with:
          files: dense.md
      - name: The default gate must have failed
        run: test "${{ steps.dense.outcome }}" = "failure"
      - name: Read the scoring version the engine reports
        id: scoring
        run: echo "version=$(sed -n 's/^const ScoringVersion = \([0-9][0-9]*\)$/\1/p' sanitize/score.go)" >> "$GITHUB_OUTPUT"
      - name: A pin on the current scoring version passes
        uses: ./
        with:
          files: tidy.md
          scoring-version: ${{ steps.scoring.outputs.version }}
      - name: A pin on a stale scoring version fails
        id: stalepin
        continue-on-error: true
        uses: ./
        with:
          files: tidy.md
          scoring-version: "0"
      - name: The stale pin must have failed
        run: test "${{ steps.stalepin.outcome }}" = "failure"

  # The SARIF log is written beside the gate, not instead of it. The gate is off here so
  # the step passes, which also proves the findings exit from the SARIF call is not taken
  # for a failure.
  action-writes-sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write a file with tells
        run: printf 'We delve into a robust plan.\n' > dirty.md
      - name: The action writes a SARIF log
        uses: ./
        with:
          files: dirty.md
          max: "100"
          sarif: slop-chop.sarif
      - name: The log is SARIF 2.1.0 and names the findings
        run: |
          jq -e '.version == "2.1.0"' slop-chop.sarif
          jq -e '.runs[0].results | length > 0' slop-chop.sarif
          jq -e '[.runs[0].results[].locations[0].physicalLocation.artifactLocation.uri] | all(. == "dirty.md")' slop-chop.sarif
          jq -e '[.runs[0].results[].level] | all(. != "error")' slop-chop.sarif

  # The text inputs stand in for the pull request event, so the job runs on every push.
  # Steps that leave the text to its event defaults run only on the event they need.
  action-checks-pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: A clean title and body pass
        uses: ./
        with:
          pull-request: "true"
          pull-request-title: Add retry logic to the fetch loop
          pull-request-body: |
            The fetch loop gave up after one 502 from the registry. This retries up to
            three times with a short backoff and logs each attempt.
      - name: A generated body fails the default gate
        id: generated
        continue-on-error: true
        uses: ./
        with:
          pull-request: "true"
          pull-request-title: Add retry logic
          pull-request-body: >-
            This PR introduces a comprehensive retry mechanism that seamlessly handles
            transient failures. Furthermore, it is important to note that it delivers a
            robust foundation.
      - name: The generated body must have failed
        run: test "${{ steps.generated.outcome }}" = "failure"
      - name: A title with two tells and no body fails the default gate
        id: title
        if: github.event_name == 'push'
        continue-on-error: true
        uses: ./
        with:
          pull-request: "true"
          pull-request-title: "feat: leverage comprehensive caching layer"
      - name: The title must have failed
        if: github.event_name == 'push'
        run: test "${{ steps.title.outcome }}" = "failure"
      - name: The default gate lets a tidy-up through
        uses: ./
        with:
          pull-request: "true"
          pull-request-title: Tidy the intro
          pull-request-body: A plain sentence  with a double space.
      - name: Strict mode fails the same text
        id: strict
        continue-on-error: true
        uses: ./
        with:
          pull-request: "true"
          pull-request-title: Tidy the intro
          pull-request-body: A plain sentence  with a double space.
          strict: "true"
      - name: Strict mode must have failed
        run: test "${{ steps.strict.outcome }}" = "failure"
      - name: A push has no pull request text and passes
        if: github.event_name == 'push'
        uses: ./
        with:
          pull-request: "true"
      - name: Fix mode refuses the pull request text
        id: fix
        continue-on-error: true
        uses: ./
        with:
          files: README.md
          mode: fix
          pull-request: "true"
      - name: Fix mode must have failed
        run: test "${{ steps.fix.outcome }}" = "failure"
      - name: A real pull request is read from its event
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          pull-request: "true"
          max: "100"

  docs-pass-their-own-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: slop-chop-binary
      - run: chmod +x slop-chop
      - name: The docs must pass slop-chop
        run: ./slop-chop check --strict README.md ENGINE.md docs/PROFILE.md docs/VOICE.md docs/BENCHMARK.md docs/SCORING.md docs/ITSELF.md docs/PLUGIN.md docs/SLACK.md docs/MCP.md docs/TELLS.md docs/API.md docs/PRIVACY.md docs/quickstart.md docs/WEB.md

  check-fails-on-slop:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: slop-chop-binary
      - run: chmod +x slop-chop
      - name: Check must exit non-zero on slop
        run: |
          printf 'In summary, a comprehensive result.\n' > dirty.md
          if ./slop-chop check dirty.md; then
            echo "check passed but should have failed" >&2
            exit 1
          fi
          echo "check failed as expected"
